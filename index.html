<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="PRISMA-SAFE — Aplikasi Keselamatan dan Kesehatan Kerja (K3) Pertambangan. Input mudah, laporan rapi, ekspor multi-format. Dapat dipasang & bekerja offline." />
<meta name="theme-color" content="#0b1530" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PRISMA-SAFE" />
<title>PRISMA-SAFE — Aplikasi K3 Pertambangan</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/app.css" />
<script src="js/vendor/xlsx.full.min.js" defer></script>
<script>window.addEventListener("load",function(){if(!window.XLSX){var s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js";s.defer=true;document.head.appendChild(s);}});</script>
</head>
<body>
<a class="skip" href="#view">Lewati ke konten</a>
<div class="shell">
  <aside class="side" id="side" aria-label="Navigasi utama">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 3 57 17v30L32 61 7 47V17z" fill="none" stroke="currentColor" stroke-width="5"/><path d="M22 33l7 7 13-15" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-tx"><b>PRISMA-SAFE</b><i>K3 Pertambangan • Nikel Open Pit</i></span>
    </div>
    <div class="side-search"><input id="navFilter" type="search" placeholder="Cari menu… (mis. P2H, PICA)" aria-label="Cari menu" /></div>
    <nav id="nav" aria-label="Modul"></nav>
    <div class="side-foot">
      <div class="easy-row">
        <label class="switch"><input type="checkbox" id="easyToggle" /> <span></span></label>
        <span><b>Mode Mudah</b><i>Untuk semua level pengguna</i></span>
      </div>
      <p class="ver">v1.1 • PWA • Data tersimpan lokal di perangkat ini</p>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn only-mobile" id="btnSide" aria-label="Buka menu"><svg class="ic ic-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="top-title"><h1 id="pageTitle">Dashboard</h1><p id="pageSub"></p></div>
      <div class="top-act">
        <button class="icon-btn" id="notifBell" aria-label="Pusat notifikasi" style="position:relative"><svg class="ic ic-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg><span id="notifBadge" style="position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center"></span></button>
        <select id="roleSel" title="Peran aktif (RBAC lokal — penegak alur, bukan keamanan server)" style="border:1px solid var(--line);border-radius:10px;padding:9px 8px;font-weight:700;max-width:140px"></select>
        <button class="btn ghost" id="btnBackup" title="Unduh seluruh data (JSON)"><svg class="ic ic-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>Backup</button>
        <button class="btn ghost" id="btnRestoreBtn" title="Pulihkan dari file backup"><svg class="ic ic-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 17v3h16v-3"/></svg>Restore</button>
        <input type="file" id="restoreFile" accept="application/json" hidden />
        <button class="btn warn" id="btnInstall" hidden><svg class="ic ic-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>Install</button>
        <button class="btn primary" id="btnQuickAdd"><svg class="ic ic-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Input Cepat</button>
      </div>
    </header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
    <footer class="foot"><span>PRISMA-SAFE • Keselamatan dan Kesehatan Kerja Pertambangan — Zero Fatality &amp; LTI.</span><span class="foot-r"><span id="netPill" class="chip grey">…</span> <span id="syncPill" class="chip green"><svg class="ic ic-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:13px;height:13px;margin-right:5px;vertical-align:-2px"><path d="M4 12.5l5 5L20 6.5"/></svg>antrean kosong</span> <span id="footStat"></span></span></footer>
  </div>
</div>
<button id="sosBtn" aria-label="Panggilan darurat SOS"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg><small>SOS</small></button>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="assertive"></div>
<script src="js/seed.js"></script>
<script src="js/icons.js"></script>
<script src="js/idb.js"></script>
<script src="js/store.js"></script>
<script src="js/audit.js"></script>
<script src="js/rbac.js"></script>
<script src="js/sync.js"></script>
<script src="js/exports.js"></script>
<script src="js/schema.js"></script>
<script src="js/views.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/hazard.js"></script>
<script src="js/ptw.js"></script>
<script src="js/rca.js"></script>
<script src="js/smkp.js"></script>
<script src="js/sos.js"></script>
<script src="js/files.js"></script>
<script src="js/notify.js"></script>
<script src="js/import.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
